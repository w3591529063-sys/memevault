name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --check src/server.js
          node --check public/app.js
          node --check public/zip.js
          node --check public/theme.js

      - name: Run tests
        run: npm test
